services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lomnov_staging_backend
    restart: unless-stopped
    volumes:
      - .:/var/www
      - /home/chaylim/image_server:/home/chaylim/image_server   
    ports:
      - "8001:8000"
    networks:
      - lomnov_staging_network
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: lomnov_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"  # Changed to 5434
    volumes:
      - lomnov_staging_db_data:/var/lib/postgresql/data
    networks:
      - lomnov_staging_network

networks:
  lomnov_staging_network:
    driver: bridge

volumes:
  lomnov_staging_db_data: